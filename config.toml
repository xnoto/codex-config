# Codex CLI configuration
# Dotfiles deploy this repo to ~/.codex, the canonical Codex config/state directory.

[mcp_servers.context-mode]
command = "context-mode"
args = []
enabled = true

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
enabled = true
startup_timeout_sec = 30

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
enabled = true
startup_timeout_sec = 30

[mcp_servers.aws-staging]
url = "http://127.0.0.1:8765/mcp"
enabled = true
startup_timeout_sec = 100
tool_timeout_sec = 120

[mcp_servers.aws-prod]
url = "http://127.0.0.1:8766/mcp"
enabled = true
startup_timeout_sec = 100
tool_timeout_sec = 120

[mcp_servers.makeitwork-apify]
url = "https://mcp-apify.makeitwork.cloud/mcp"
enabled = true
startup_timeout_sec = 30
env_http_headers = { "CF-Access-Client-Id" = "CF_ACCESS_CLIENT_ID", "CF-Access-Client-Secret" = "CF_ACCESS_CLIENT_SECRET" }

[mcp_servers.makeitwork-argocd]
