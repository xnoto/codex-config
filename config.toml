# Codex CLI configuration
# Dotfiles deploy this repo to ~/.codex, the canonical Codex config/state directory.

[mcp_servers.context-mode]
command = "context-mode"
args = []
enabled = true

[mcp_servers.parallel-search]
url = "http://127.0.0.1:8782/mcp"
enabled = true
startup_timeout_sec = 30

[mcp_servers.linear]
command = "bunx"
args = ["--bun", "mcp-remote", "https://mcp.linear.app/mcp"]
enabled = true

[mcp_servers.notion]
command = "bunx"
args = ["--bun", "mcp-remote", "https://mcp.notion.com/mcp", "--transport", "http-only"]
enabled = true

[mcp_servers.aws-staging]
url = "http://127.0.0.1:8765/mcp"
enabled = true
startup_timeout_sec = 100
tool_timeout_sec = 120

[mcp_servers.aws-prod]
url = "http://127.0.0.1:8766/mcp"
enabled = true
startup_timeout_sec = 100
tool_timeout_sec = 120

[mcp_servers.aws-docs]
url = "http://127.0.0.1:8767/mcp"
enabled = true
startup_timeout_sec = 30

[mcp_servers.github]
url = "http://127.0.0.1:8778/mcp"
enabled = true

[mcp_servers.grafana]
url = "http://127.0.0.1:8768/mcp"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.agent-hub]
url = "http://127.0.0.1:8776/mcp"
enabled = true

[mcp_servers.tmux]
url = "http://127.0.0.1:8770/mcp"
enabled = true

[mcp_servers.terraform-docs]
url = "http://127.0.0.1:8771/mcp"
enabled = true
startup_timeout_sec = 30

[mcp_servers.opentofu-docs]
url = "https://mcp.opentofu.org/mcp"
enabled = true
