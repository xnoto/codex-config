# Codex CLI configuration
# Dotfiles deploy this repo to ~/.codex, the canonical Codex config/state directory.

[mcp_servers.context-mode]
command = "context-mode"
args = []
enabled = true

[mcp_servers.parallel-search]
url = "https://mcp-makeitwork-parallel-search.makeitwork.cloud/mcp"
enabled = true
startup_timeout_sec = 30
env_http_headers = { "CF-Access-Client-Id" = "CF_ACCESS_CLIENT_ID", "CF-Access-Client-Secret" = "CF_ACCESS_CLIENT_SECRET", "User-Agent" = "makeitwork-mcp-client/1.0" }

[mcp_servers.linear]
command = "bunx"
args = ["--bun", "mcp-remote", "https://mcp.linear.app/mcp"]
enabled = true

[mcp_servers.notion]
command = "bunx"
args = ["--bun", "mcp-remote", "https://mcp.notion.com/mcp", "--transport", "http-only"]
enabled = true

[mcp_servers.aws-staging]
url = "http://127.0.0.1:8765/mcp"
enabled = true
startup_timeout_sec = 100
tool_timeout_sec = 120

[mcp_servers.aws-prod]
url = "http://127.0.0.1:8766/mcp"
enabled = true
startup_timeout_sec = 100
tool_timeout_sec = 120

[mcp_servers.aws-docs]
url = "https://mcp-makeitwork-aws-docs.makeitwork.cloud/mcp"
enabled = true
startup_timeout_sec = 30
env_http_headers = { "CF-Access-Client-Id" = "CF_ACCESS_CLIENT_ID", "CF-Access-Client-Secret" = "CF_ACCESS_CLIENT_SECRET" }

