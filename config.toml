[mcp_servers.linkedin]
command = "uvx"
args = ["mcp-server-linkedin@latest"]
enabled = true
startup_timeout_sec = 100
tool_timeout_sec = 200
env = { "UV_HTTP_TIMEOUT" = "300" }
